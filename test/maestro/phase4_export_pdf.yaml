# Maestro Flow — Phase 4: Export PDF
# Validates PDF export UI in Settings → General
# Run: maestro test test/maestro/phase4_export_pdf.yaml
#
# Pre-requisite: Phase 3 sign-off

appId: com.orbacetech.stalio
---
# ---------------------------------------------------------------------------
# TC-P4-PDF-01: Settings → General shows Export PDF button
# ---------------------------------------------------------------------------
- launchApp
- tapOn: "Settings"
- assertVisible: "Export PDF"
- takeScreenshot: screenshots/p4_pdf_01_button

---
# ---------------------------------------------------------------------------
# TC-P4-PDF-02: Tap Export PDF opens date range picker
# ---------------------------------------------------------------------------
- scroll
- tapOn: "Export PDF"
- assertVisible: "Select Export Range"
- assertVisible: "All time"
- assertVisible: "Last 30 days"
- assertVisible: "Last 90 days"
- takeScreenshot: screenshots/p4_pdf_02_range_picker

---
# ---------------------------------------------------------------------------
# TC-P4-PDF-03: Cancel returns to settings
# ---------------------------------------------------------------------------
- tapOn: "Cancel"
- assertVisible: "Export PDF"
- takeScreenshot: screenshots/p4_pdf_03_cancelled

---
# ---------------------------------------------------------------------------
# TC-P4-PDF-04: Export with All time → progress + share sheet
# ---------------------------------------------------------------------------
- scroll
- tapOn: "Export PDF"
- tapOn: "All time"
- assertVisible
- takeScreenshot: screenshots/p4_pdf_04_share
