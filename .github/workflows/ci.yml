name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: |
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log || true
          if grep -q 'error •' /tmp/analyze.log; then exit 1; fi

      - name: Run tests
        run: flutter test --coverage

      - name: Check coverage
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          lcov --summary coverage/lcov.info 2>/dev/null | grep lines | head -1
